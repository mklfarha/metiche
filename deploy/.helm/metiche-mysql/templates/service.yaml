apiVersion: v1
kind: Service
metadata:
  name: {{ include "metiche-mysql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche-mysql.labels" . | nindent 4 }}
spec:
  # ClusterIP, never NodePort or LoadBalancer. The database is reachable from
  # inside this namespace and from nowhere else; the box is shared with other
  # projects and a NodePort would put MySQL on a public interface.
  type: {{ .Values.service.type }}
  selector:
    {{- include "metiche-mysql.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metiche-mysql.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche-mysql.labels" . | nindent 4 }}
spec:
  # The StatefulSet's governing Service: gives the pod a stable DNS name of
  # its own. Clients should use the ClusterIP Service above.
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "metiche-mysql.selectorLabels" . | nindent 4 }}
  ports:
    - name: mysql
      port: {{ .Values.service.port }}
      targetPort: mysql
      protocol: TCP
