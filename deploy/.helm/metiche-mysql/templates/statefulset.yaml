apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "metiche-mysql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche-mysql.labels" . | nindent 4 }}
spec:
  # One instance. Not a cluster, not a replica set: docs/PLAN.md's capacity
  # analysis says one MySQL pod carries this workload with twenty to a
  # hundred times headroom, and a second instance would add failure modes
  # (split sequence, replication lag under the team lock) that buy nothing.
  replicas: 1
  serviceName: {{ include "metiche-mysql.fullname" . }}-headless
  # OnDelete would be safer still, but Recreate-by-default RollingUpdate on a
  # single-replica StatefulSet already terminates the old pod before starting
  # the new one, so the datadir is never opened twice.
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "metiche-mysql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll on a server-config change. NOT on a credential change: the
        # Secret is not rendered here, and rotating the password is a
        # deliberate, manual procedure (see deploy/README.md).
        checksum/config: {{ .Values.mysqlConf | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "metiche-mysql.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "metiche-mysql.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The mysql image's entrypoint takes its credentials from the
            # environment; there is no file-based alternative that also does
            # first-boot initialisation. Both values come from a Secret, so
            # they are not visible in `kubectl get statefulset -o yaml` and
            # not in this repo.
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.rootPasswordKey }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.userPasswordKey }}
            - name: MYSQL_DATABASE
              value: {{ .Values.db.name | quote }}
            - name: MYSQL_USER
              value: {{ .Values.db.user | quote }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                {{- include "metiche-mysql.pingCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                {{- include "metiche-mysql.pingCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                {{- include "metiche-mysql.pingCommand" . | nindent 16 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            {{- if .Values.mysqlConf }}
            - name: conf
              mountPath: /etc/mysql/conf.d
              readOnly: true
            {{- end }}
            - name: db-credentials
              mountPath: {{ .Values.probes.secretMountPath }}
              readOnly: true
      volumes:
        {{- if .Values.mysqlConf }}
        - name: conf
          configMap:
            name: {{ include "metiche-mysql.fullname" . }}-conf
        {{- end }}
        # Mounted for the probes only — the entrypoint reads the env vars
        # above. Keeping a file copy is what lets the probe avoid argv.
        - name: db-credentials
          secret:
            secretName: {{ .Values.auth.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.rootPasswordKey }}
                path: root-password
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        # NO PERSISTENCE. Every restart loses the database. Only ever correct
        # for a throwaway test namespace.
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    # A PVC, never a PersistentVolume: a PV is cluster-scoped and this chart
    # must not create cluster-scoped objects. The storage class named below
    # already exists on the box; its provisioner makes the PV.
    #
    # Helm does not delete volumeClaimTemplate PVCs on uninstall. That is the
    # intended behaviour here — the data outlives the release.
    - metadata:
        name: data
        labels:
          {{- include "metiche-mysql.labels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
