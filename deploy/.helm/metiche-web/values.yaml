# metiche-web — the board.
#
# code/frontend built into a single Go binary. Static assets and the fixture
# recordings are compiled in with go:embed (code/frontend/embed.go), so there
# is no asset volume, no sidecar and no init container: one binary, one port.
#
# It holds no state and needs no database. Everything it shows comes from the
# backend's SSE stream, or — with backend.url empty — from the recordings
# baked into the image.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
# NOTE ON REPLICAS: each pod keeps its own in-memory fold of the event stream
# and its own SSE subscribers. Two pods are independently correct (each opens
# its own upstream stream and replays from its own cursor), but a browser that
# reconnects to the OTHER pod resumes from a cursor that pod may not have
# reached yet. One replica until that is worth solving; the board is cheap.

image:
  # Built on the box by deploy/scripts/build-images.sh from
  # deploy/docker/metiche-web.Dockerfile with code/frontend as the context,
  # then imported straight into microk8s's containerd. No registry, hence
  # pullPolicy: Never.
  repository: metiche-web
  # "" → .Chart.AppVersion. ALWAYS A QUOTED STRING, passed with --set-string
  # (helm-deploy.sh does). A numeric-looking tag such as 20260912213026 is read
  # as a number and --reuse-values turns it into 2.0260912213026e+13 →
  # InvalidImageName. "metiche-web.imageTag" in _helpers.tpl guards the render.
  tag: ""
  pullPolicy: Never
imagePullSecrets: []

# -- Where the board gets its data -----------------------------------------
# THE BACKEND ADDRESS IS CONFIGURATION, NOT A CONSTANT. It is never baked into
# the image and never written into a template: the same image runs against a
# local backend, a staging one, or none at all.
backend:
  # Leave url empty and the address is derived from the values below, which is
  # how a normal in-cluster install works — it resolves to the backend
  # Service in this same namespace, so nothing leaves the cluster and no
  # public hostname is involved in the board→backend hop.
  #
  # Set url explicitly to point somewhere else (a backend in another
  # namespace, or https://api.metiche.xyz if you want the hop to go out and
  # back through the ingress, which you do not).
  url: ""
  # Used to derive url when it is empty. serviceName must match the metiche
  # release's fullname — the default "metiche" is what `helm install metiche
  # deploy/.helm/metiche` produces. With the api/mcp split this becomes
  # "metiche-api".
  serviceName: metiche
  port: 8080
  # OPTIONAL pre-warm list: comma-separated live team slugs registered at
  # startup, passed as -teams. Empty (the default) omits the flag.
  #
  # No team has to be named here any more. With discovery on (below) the board
  # registers a team the first time somebody opens /t/<slug>, if the backend
  # answers 200 for it. Pre-warming only saves that first visitor one backend
  # round trip. A slug is not a credential — the join code is, and it never
  # appears here or anywhere else in deploy/. Never list a slug that a demo
  # recording holds ("demo", "demo-*"): it is refused and logged.
  teams: ""

# -- Demo boards (mixed mode) -------------------------------------------------
# The recordings baked into the image, served next to the real teams as
# /t/demo and /t/demo-tidewater, looping forever and labelled on every page as
# a recording. They are what a new visitor sees, what the landing page's "see a
# live demo" link opens, and the ONLY teams the public pages (/, /teams, /join,
# /healthz) ever list. Passed as -demo.
demo:
  enabled: true

# -- On-demand team discovery -------------------------------------------------
# With a backend configured, a request for an unregistered /t/<slug> asks the
# backend GET /v1/teams/<slug>. 200 → a live board is registered and served;
# 404 → the not-found page, remembered for notFoundTTL. The backend answers 404
# for private teams too. The board holds NO credential of its own: there is no
# METICHE_BOARD_TOKEN any more (docs/BOARD_LOGIN.md §9, decision 7), and the
# board refuses to start if one is set, so never put it in env/envFrom. A
# private team is shown only to a signed-in member, read with that viewer's own
# browser session (§4.2); anonymous visitors discover only PUBLIC teams.
discovery:
  enabled: true
  # Cap on teams registered this way (each holds one upstream SSE stream).
  maxTeams: 50
  # How long a 404 is believed. A Go duration.
  notFoundTTL: 30s

# -- Fixture mode ----------------------------------------------------------
# With backend.url empty AND backend.serviceName empty, the binary gets no
# -backend flag and serves ONLY the embedded recordings. That is the
# board-only deploy: no backend and no database, which is exactly what you
# want for a first smoke test of ingress + TLS + SSE before the backend exists.
#
#   helm upgrade --install metiche-web ... --set backend.serviceName=""
fixtures:
  # Replay speed multiplier and the number of events delivered instantly on
  # connect. Apply to the demo boards in both modes.
  speed: 6
  warmup: 30
  # Fixture mode only: with a backend the demo boards always loop.
  loop: true

# Extra flags appended verbatim to the binary's argv.
extraArgs: []

env: {}
envFrom: []

service:
  type: ClusterIP
  port: 80
  containerPort: 8787

# -- Health probes ----------------------------------------------------------
# The board has no database, so the liveness/readiness split has less to say
# here than it does for the backend — but the rule is the same and is worth
# keeping visible: liveness answers "is this process serving HTTP" and nothing
# else. /healthz (internal/web/server.go) reports the feed name and both
# cursors per team from memory; it makes no outbound call, so a backend
# outage does not get board pods killed. That is deliberate: the board is
# still worth serving when the backend is down — it shows the last state it
# folded and reconnects on its own.
livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: true
  # See the metiche chart's values.yaml: "public" is the microk8s ingress
  # addon's class, "nginx" is upstream ingress-nginx's. Check the box.
  className: public
  # A ClusterIssuer that already exists on the box. Referenced, never created.
  clusterIssuer: letsencrypt-prod
  annotations: {}
  hosts:
    - name: board
      host: metiche.xyz
      path: /
      pathType: Prefix
      tls:
        enabled: true
        secretName: metiche-web-tls
  # Add the apex's www alias here if DNS points it at the box too:
  #  - name: www
  #    host: www.metiche.xyz
  #    ...

  # -- /signin, rate limited per client IP ------------------------------------
  # docs/BOARD_LOGIN.md §6.1, §6.2. /signin is where a sign-in link's secret is
  # exchanged for a browser session. For EVERY host above this renders a second
  # Ingress: path /signin, pathType Exact, carrying ingress-nginx's per-client-IP
  # limit. The `/` Prefix Ingress already routes /signin; nginx matches the
  # Exact location first, so the limit applies to /signin alone and the board's
  # pages and SSE streams are never throttled. Per host, so an alias added above
  # cannot become an unlimited way in.
  #
  # This is the per-IP layer. Behind it: the board's own signinLimit and the
  # backend's global exchange backstop.
  #
  # nginx keys the limit on the address it believes is the client. That is the
  # real one only if nothing in front of the controller hides it and the
  # controller does not trust client-supplied X-Forwarded-For
  # (use-forwarded-headers). deploy/scripts/preflight.sh prints which it is.
  #
  # No cert-manager annotation here: this Ingress reuses the host's TLS secret,
  # which the host's own Ingress already requests. Annotating both would give
  # one Secret two owning Ingresses.
  #
  # ONLY /signin. /v1/browser/* and /v1/teams/{slug}/access are backend routes
  # reached in-cluster; they never appear in any Ingress of either chart.
  signin:
    enabled: true
    # nginx.ingress.kubernetes.io/limit-rpm. Must be > 0: "0" disables the limit.
    limitRpm: 20
    # nginx.ingress.kubernetes.io/limit-burst-multiplier. Must be >= 1.
    limitBurstMultiplier: 2

# -- SSE --------------------------------------------------------------------
# THE BOARD'S OWN STREAM IS THE ONE USERS SEE. /t/{slug}/stream is a
# text/event-stream held open for as long as a tab is open, carrying rendered
# HTML fragments (two event names: `timeline` appends, `board` re-renders).
#
# nginx buffers proxied responses by default and cuts idle upstreams after
# 60s. Both are fatal here and neither looks like a proxy problem: with
# buffering on the board simply never paints, and with the 60s timeout it
# silently reconnects every minute — htmx's SSE extension is good enough at
# recovering that the only symptom is a flicker and the occasional missed
# frame. Somebody will spend a day in the frontend. Do not remove these.
sse:
  enabled: true
  readTimeout: 3600
  sendTimeout: 3600
  disableRequestBuffering: true

podAnnotations: {}
podLabels: {}

# Unlike the backend image, this one is built by deploy/docker/metiche-web.Dockerfile
# with the binary in /usr/local/bin, so it can and does run as a non-root user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # The board writes nothing to disk: assets are embedded and state is in
  # memory. A read-only root filesystem costs nothing and is real containment.
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

strategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false
