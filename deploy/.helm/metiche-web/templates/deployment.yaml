{{- $backendURL := include "metiche-web.backendURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metiche-web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "metiche-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "metiche-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "metiche-web.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: metiche-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "-addr=:{{ .Values.service.containerPort }}"
            {{- if $backendURL }}
            # The backend address is configuration. It is derived from the
            # backend Service in this namespace unless backend.url overrides
            # it — no hostname is hardcoded in this chart or in the image.
            - "-backend={{ $backendURL }}"
            # Mixed mode: the demo recordings next to the real teams, and real
            # teams registered on first request. -teams is only a pre-warm.
            - "-demo={{ .Values.demo.enabled }}"
            - "-discover={{ .Values.discovery.enabled }}"
            - "-max-discovered-teams={{ .Values.discovery.maxTeams }}"
            - "-discover-notfound-ttl={{ .Values.discovery.notFoundTTL }}"
            {{- with .Values.backend.teams }}
            - "-teams={{ . }}"
            {{- end }}
            {{- else }}
            # No backend configured: replay the recordings embedded in the
            # image. Useful before the backend exists, and the fastest way to
            # prove ingress + TLS + SSE work end to end on their own.
            {{- if .Values.fixtures.loop }}
            - "-loop"
            {{- end }}
            {{- end }}
            - "-speed={{ .Values.fixtures.speed }}"
            - "-warmup={{ .Values.fixtures.warmup }}"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          # Liveness: in-memory only. The board has no database, and a backend
          # outage must not get board pods killed — a board serving its last
          # known state while it reconnects is far better than no board.
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
