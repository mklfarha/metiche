apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metiche.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "metiche.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the config overlay changes. The Secret's contents
        # are never rendered here — only the name — so this is a checksum of
        # the reference, not of the credential. A config change therefore
        # needs an explicit `kubectl rollout restart`; see deploy/README.md.
        metiche.xyz/config-secret: {{ .Values.config.secretName | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "metiche.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "metiche.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: metiche
          image: "{{ .Values.image.repository }}:{{ include "metiche.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          # The image's own ENTRYPOINT names the binary after the project and
          # the compiler names it after the go module's last path element, so
          # they disagree. See values.yaml `command`.
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # Which surfaces this process serves. See values.yaml `role`.
            - name: METICHE_ROLE
              value: {{ .Values.role | quote }}
            # The generated loader reads CONFIG as a comma-separated list and
            # merges in order: the image's committed placeholders first, the
            # mounted overlay second. Nothing sensitive is in the image.
            - name: CONFIG
              value: {{ include "metiche.configPath" . | quote }}
            # The image already sets ENV=prod; restated so the merge order is
            # readable from the Deployment without opening the Dockerfile.
            - name: ENV
              value: "prod"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          # LIVENESS MUST NOT TOUCH THE DATABASE. /healthz is the generated
          # static handler; it answers "is this process serving HTTP" and
          # nothing else. A database blip must never get a healthy pod killed.
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          # Readiness MAY check the database: a pod that cannot reach MySQL has
          # nothing useful to answer with and should leave the Service. Point
          # this at a database-aware endpoint when the backend grows one.
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # The real configuration, supplied from outside the image as a file.
        # Created on the box by deploy/scripts/gen-credentials.sh; never by
        # this chart, and never committed.
        - name: config
          secret:
            secretName: {{ .Values.config.secretName }}
            defaultMode: {{ .Values.config.defaultMode }}
            items:
              - key: {{ .Values.config.key }}
                path: {{ .Values.config.key }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
