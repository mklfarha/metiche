{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metiche.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metiche.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The backend never calls the Kubernetes API. No Role, no RoleBinding, and
# certainly no ClusterRole: this chart must not touch anything cluster-scoped.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
