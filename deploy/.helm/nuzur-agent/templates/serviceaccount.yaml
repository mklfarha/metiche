{{- include "nuzur-agent.guard" . }}
# Its own ServiceAccount so the pod never runs as `default`, and no token is
# mounted: the agent never talks to the Kubernetes API. No Role or RoleBinding
# exists for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nuzur-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nuzur-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
