<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">metiche architecture</title>
  <desc id="d">Coding agents belonging to different people call the metiche MCP server over MCP. The server takes a per-team lock, appends to an append-only event log in MySQL, and runs deterministic detection inside the same call, so the agent that creates a collision is told in its own tool response. The board receives live updates over SSE, and a person on the board can send a nudge, which is stored as an instruction and delivered on the target agent's next call, because MCP cannot push.</desc>

  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FB345D"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E58E8"/></marker>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#01E3FC"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FCFCFB" fill-opacity="0.55"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FCFCFB" fill-opacity="0.38"/></marker>
  </defs>

  <rect x="0" y="0" width="940" height="640" rx="18" fill="#180655"/>

  <!-- title -->
  <text x="40" y="46" font-size="21" font-weight="700" fill="#FCFCFB">metiche</text>
  <text x="126" y="46" font-size="12.5" fill="#FCFCFB" fill-opacity="0.62">what every agent reports, and how the answer gets back to it</text>

  <!-- column captions -->
  <text x="40" y="78" font-size="10" font-weight="700" letter-spacing="1.4" fill="#FCFCFB" fill-opacity="0.42">AGENTS · MCP CLIENTS</text>
  <text x="336" y="78" font-size="10" font-weight="700" letter-spacing="1.4" fill="#FCFCFB" fill-opacity="0.42">METICHE SERVER</text>
  <text x="700" y="78" font-size="10" font-weight="700" letter-spacing="1.4" fill="#FCFCFB" fill-opacity="0.42">BOARD · PEOPLE</text>

  <!-- agent cards -->
  <rect x="40" y="96" width="206" height="66" rx="10" fill="#FCFCFB" fill-opacity="0.06" stroke="#FCFCFB" stroke-opacity="0.18"/>
  <rect x="40" y="96" width="4" height="66" rx="2" fill="#FB345D"/>
  <text x="58" y="121" font-size="13" font-weight="600" fill="#FCFCFB">Ana · agent 1</text>
  <text x="58" y="139" font-size="10.5" fill="#FB345D">declare_intent</text>
  <text x="58" y="154" font-size="10" fill="#FCFCFB" fill-opacity="0.62">writes internal/auth/auth.go</text>

  <rect x="40" y="182" width="206" height="66" rx="10" fill="#FCFCFB" fill-opacity="0.06" stroke="#FCFCFB" stroke-opacity="0.18"/>
  <rect x="40" y="182" width="4" height="66" rx="2" fill="#6E58E8"/>
  <text x="58" y="207" font-size="13" font-weight="600" fill="#FCFCFB">Beto · agent 1</text>
  <text x="58" y="225" font-size="10.5" fill="#9E8CF5">declare_intent</text>
  <text x="58" y="240" font-size="10" fill="#FCFCFB" fill-opacity="0.62">the same file, two minutes later</text>

  <rect x="40" y="268" width="206" height="66" rx="10" fill="#FCFCFB" fill-opacity="0.06" stroke="#FCFCFB" stroke-opacity="0.18"/>
  <rect x="40" y="268" width="4" height="66" rx="2" fill="#FCFCFB" fill-opacity="0.35"/>
  <text x="58" y="293" font-size="13" font-weight="600" fill="#FCFCFB">Ana · agent 2</text>
  <text x="58" y="311" font-size="10.5" fill="#FCFCFB" fill-opacity="0.72">heartbeat every ~60s</text>
  <text x="58" y="326" font-size="10" fill="#FCFCFB" fill-opacity="0.62">one person, several agents</text>

  <!-- server panel -->
  <rect x="336" y="88" width="300" height="302" rx="12" fill="#FCFCFB" fill-opacity="0.05" stroke="#6E58E8" stroke-opacity="0.6"/>
  <text x="352" y="112" font-size="13" font-weight="600" fill="#FCFCFB">metiche MCP server · Go</text>
  <text x="352" y="128" font-size="10" fill="#FCFCFB" fill-opacity="0.55">one process, no outbound model calls</text>

  <rect x="350" y="140" width="272" height="52" rx="8" fill="#FCFCFB" fill-opacity="0.07"/>
  <text x="362" y="161" font-size="11.5" font-weight="600" fill="#FCFCFB">MCP tool surface · 15 tools</text>
  <text x="362" y="179" font-size="10" fill="#FCFCFB" fill-opacity="0.62">declare_intent · update_intent · heartbeat</text>

  <rect x="350" y="200" width="272" height="52" rx="8" fill="#FCFCFB" fill-opacity="0.07"/>
  <text x="362" y="221" font-size="11.5" font-weight="600" fill="#FCFCFB">team lock → sequence → event</text>
  <text x="362" y="239" font-size="10" fill="#FCFCFB" fill-opacity="0.62">detection runs inside this transaction</text>

  <rect x="350" y="260" width="272" height="62" rx="8" fill="#FCFCFB" fill-opacity="0.07"/>
  <text x="362" y="281" font-size="11.5" font-weight="600" fill="#FCFCFB">deterministic detection</text>
  <text x="362" y="298" font-size="10" fill="#FCFCFB" fill-opacity="0.62">path overlap · contract mismatch</text>
  <text x="362" y="314" font-size="10" font-weight="600" fill="#01E3FC">no model call, so no API key</text>

  <rect x="350" y="330" width="272" height="50" rx="8" fill="#FCFCFB" fill-opacity="0.07"/>
  <text x="362" y="351" font-size="11.5" font-weight="600" fill="#FCFCFB">review block → the caller's own model</text>
  <text x="362" y="369" font-size="10" fill="#FCFCFB" fill-opacity="0.62">its verdict comes back as report_judgement</text>

  <!-- MySQL -->
  <path d="M486 390 L486 430" fill="none" stroke="#FCFCFB" stroke-opacity="0.55" stroke-width="1.8" marker-end="url(#aw)"/>
  <text x="498" y="415" font-size="10" fill="#FCFCFB" fill-opacity="0.55">every call appends</text>
  <rect x="336" y="436" width="300" height="82" rx="12" fill="#FCFCFB" fill-opacity="0.06" stroke="#FCFCFB" stroke-opacity="0.18"/>
  <text x="352" y="463" font-size="13" font-weight="600" fill="#FCFCFB">MySQL</text>
  <text x="352" y="482" font-size="10" fill="#FCFCFB" fill-opacity="0.62">append-only event log, one sequence per team</text>
  <text x="352" y="499" font-size="10" fill="#FCFCFB" fill-opacity="0.62">claims are advisory and expire — nothing is locked</text>

  <!-- board -->
  <rect x="700" y="96" width="208" height="108" rx="12" fill="#FCFCFB" fill-opacity="0.06" stroke="#FCFCFB" stroke-opacity="0.18"/>
  <circle cx="892" cy="114" r="4" fill="#01E3FC"/>
  <text x="716" y="124" font-size="13" font-weight="600" fill="#FCFCFB">team board</text>
  <text x="716" y="145" font-size="10" fill="#FCFCFB" fill-opacity="0.62">templ + htmx, a lane per member</text>
  <text x="716" y="161" font-size="10" fill="#FCFCFB" fill-opacity="0.62">timeline appends on sequence,</text>
  <text x="716" y="176" font-size="10" fill="#FCFCFB" fill-opacity="0.62">board repaints on board_revision</text>
  <text x="716" y="194" font-size="10" fill="#FCFCFB" fill-opacity="0.45">sub-second, no polling in the page</text>

  <path d="M640 150 L694 150" fill="none" stroke="#FCFCFB" stroke-opacity="0.55" stroke-width="1.8" marker-end="url(#aw)"/>
  <text x="667" y="134" font-size="10" font-weight="600" text-anchor="middle" fill="#FCFCFB" fill-opacity="0.72">SSE</text>
  <text x="667" y="168" font-size="9.5" text-anchor="middle" fill="#FCFCFB" fill-opacity="0.5">fragments</text>

  <!-- person -->
  <path d="M804 204 L804 262" fill="none" stroke="#FCFCFB" stroke-opacity="0.38" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="812" y="238" font-size="9.5" fill="#FCFCFB" fill-opacity="0.45">watching</text>
  <rect x="700" y="268" width="208" height="92" rx="12" fill="#FCFCFB" fill-opacity="0.06" stroke="#01E3FC" stroke-opacity="0.45"/>
  <text x="716" y="296" font-size="13" font-weight="600" fill="#FCFCFB">a person on the board</text>
  <text x="716" y="316" font-size="10" fill="#FCFCFB" fill-opacity="0.62">sees it before the commit does</text>
  <text x="716" y="336" font-size="10.5" font-weight="600" fill="#01E3FC">nudge · stop / steer / ask</text>

  <path d="M696 312 C 666 312, 668 338, 642 338" fill="none" stroke="#01E3FC" stroke-width="2" marker-end="url(#aq)"/>
  <text x="668" y="366" font-size="9.5" text-anchor="middle" fill="#01E3FC" fill-opacity="0.85">stored as</text>
  <text x="668" y="378" font-size="9.5" text-anchor="middle" fill="#01E3FC" fill-opacity="0.85">instruction</text>

  <!-- standing rule -->
  <path d="M701 400 L701 470" stroke="#FB345D" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <text x="716" y="416" font-size="11.5" font-weight="600" fill="#FCFCFB">nobody is ever blocked</text>
  <text x="716" y="434" font-size="10" fill="#FCFCFB" fill-opacity="0.62">claims are advisory, with a TTL</text>
  <text x="716" y="450" font-size="10" fill="#FCFCFB" fill-opacity="0.62">records low, interrupts at medium</text>
  <text x="716" y="466" font-size="10" fill="#FCFCFB" fill-opacity="0.62">ordering assigns responsibility</text>

  <!-- forward MCP calls: two declarations crossing -->
  <path d="M248 129 C 290 129, 290 250, 332 250" fill="none" stroke="#FB345D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ac)"/>
  <path d="M248 215 C 290 215, 290 170, 332 170" fill="none" stroke="#6E58E8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ai)"/>
  <path d="M248 301 C 292 301, 290 300, 332 300" fill="none" stroke="#FCFCFB" stroke-opacity="0.38" stroke-width="1.8" stroke-linecap="round" marker-end="url(#am)"/>
  <circle cx="290" cy="191" r="12" fill="none" stroke="#5317FB" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="290" cy="191" r="6.5" fill="#5317FB"/>

  <!-- return path 1: the later declarer is answered inside its own call -->
  <path d="M332 356 C 296 350, 268 312, 262 250 C 259 234, 258 228, 250 226" fill="none" stroke="#01E3FC" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#aq)"/>
  <text x="170" y="380" font-size="11" font-weight="600" text-anchor="middle" fill="#01E3FC">the conflict rides Beto's own response</text>
  <text x="170" y="396" font-size="10" text-anchor="middle" fill="#FCFCFB" fill-opacity="0.62">detection already ran inside that call</text>

  <!-- return path 2: the earlier declarer, and the nudge, wait for the next call -->
  <path d="M334 376 C 230 545, 18 520, 18 129 L 32 129" fill="none" stroke="#01E3FC" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round" marker-end="url(#aq)"/>
  <text x="215" y="500" font-size="11" font-weight="600" text-anchor="middle" fill="#01E3FC">Ana learns on her agent's next call</text>
  <text x="215" y="516" font-size="10" text-anchor="middle" fill="#FCFCFB" fill-opacity="0.62">MCP cannot push — a bare heartbeat collects it</text>

  <!-- legend -->
  <path d="M40 546 L900 546" stroke="#FCFCFB" stroke-opacity="0.12" stroke-width="1"/>

  <path d="M40 566 L66 566" stroke="#FB345D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M40 574 L66 574" stroke="#6E58E8" stroke-width="2.2" stroke-linecap="round"/>
  <text x="76" y="574" font-size="10.5" fill="#FCFCFB" fill-opacity="0.8">an agent declaring what it is about to do, and the paths it takes</text>

  <circle cx="53" cy="597" r="6" fill="#5317FB"/>
  <text x="76" y="601" font-size="10.5" fill="#FCFCFB" fill-opacity="0.8">where two declarations overlap</text>

  <path d="M470 570 L496 570" stroke="#01E3FC" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round"/>
  <text x="506" y="574" font-size="10.5" fill="#FCFCFB" fill-opacity="0.8">return path — reaches an agent only as a tool response</text>

  <path d="M470 597 L496 597" stroke="#01E3FC" stroke-width="2.4" stroke-linecap="round"/>
  <text x="506" y="601" font-size="10.5" fill="#FCFCFB" fill-opacity="0.8">a person's nudge, raised from the board</text>
</svg>
